[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "biquadforge"
version = "0.1.0"
description = "Finite-suite scalar Q15 qualification and reproducible CMSIS deployment packs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
license = "MIT"
[project.scripts]
biquadforge = "biquadforge.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
biquadforge = ["reference_hashes.json"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
