name: portable-qualification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest build "setuptools>=77" wheel
      - run: python -m pytest -q
      - run: python -m build
      - run: biquadforge build examples/quiet_fir.json --out quiet-pack
      - run: biquadforge verify quiet-pack --cmsis-root tests/reference/cmsisdsp-1.10.3
